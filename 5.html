<!DOCTYPE html>
<html>
<body>

<h2>Registration Form</h2>

<form>
<table border="1">

<tr>
<td>Name:</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Password:</td>
<td><input type="password"></td>
</tr>

<tr>
<td>DOB:</td>
<td><input type="date"></td>
</tr>

<tr>
<td>Gender:</td>
<td>
<input type="radio" name="g"> Male
<input type="radio" name="g"> Female
</td>
</tr>

<tr>
<td>Hobbies:</td>
<td>
<input type="checkbox"> Reading
<input type="checkbox"> Sports
</td>
</tr>

<tr>
<td>Country:</td>
<td>
<select>
<option>India</option>
<option>USA</option>
</select>
</td>
</tr>

<tr>
<td>Address:</td>
<td><textarea></textarea></td>
</tr>

<tr>
<td colspan="2">
<input type="submit">
<input type="reset">
</td>
</tr>

</table>
</form>

</body>
</html>
