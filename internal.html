<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Example</title>

    <style>
        body {
            background-color: lightyellow;
        }

        h1 {
            color: green;
            text-align: center;
        }

        p {
            font-size: 18px;
            color: brown;
        }

        .highlight {
            background-color: lightblue;
            font-weight: bold;
        }
    </style>

</head>
<body>

<h1>Internal CSS Demo</h1>
<p>This is a normal paragraph.</p>
<p class="highlight">This paragraph uses a class selector.</p>

</body>
</html>
